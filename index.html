<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Rug Showroom · Phase 0 probe</title>
  <style>
    html, body { margin: 0; height: 100%; background: #16110b; color: #efe7d6; font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
    canvas { display: block; }
    #panel {
      position: fixed; top: 12px; left: 12px; z-index: 10; max-width: min(92vw, 520px);
      background: rgba(22, 17, 11, 0.86); border: 1px solid rgba(239, 231, 214, 0.25); border-radius: 10px;
      padding: 12px 14px; font-size: 13px; line-height: 1.45;
    }
    #panel h1 { font-size: 15px; margin: 0 0 6px; font-weight: 600; letter-spacing: .02em; }
    #panel p { margin: 4px 0 8px; color: rgba(239, 231, 214, 0.75); }
    #probe { margin: 0; white-space: pre-wrap; word-break: break-word; font: 11.5px/1.4 ui-monospace, Menlo, monospace; max-height: 42vh; overflow: auto; }
    #actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    #actions button { appearance: none; border: 1px solid rgba(239, 231, 214, 0.35); background: transparent; color: #efe7d6; border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer; }
    #actions button:hover { border-color: #c79a3c; color: #c79a3c; }
    #status { font-size: 12px; color: #c79a3c; min-height: 1.2em; margin-top: 6px; }
    /* three.js VRButton sits bottom-centre; keep it large for a headset tap */
    #VRButton { font-size: 16px !important; padding: 14px 20px !important; }
  </style>
  <script type="module" crossorigin src="/rug-showroom/assets/index-amOdoJkt.js"></script>
</head>
<body>
  <div id="panel">
    <h1>Rug Showroom · Phase 0 probe</h1>
    <p>Grey 8 ft × 10 ft slab at true size. Point a controller at the floor and pull the trigger to teleport. Push the right thumbstick left or right to snap-turn.</p>
    <pre id="probe">collecting…</pre>
    <div id="actions">
      <button id="copyProbe" type="button">Copy probe values</button>
      <button id="toggleHud" type="button">Hide in-VR readout</button>
    </div>
    <div id="status"></div>
  </div>
</body>
</html>
